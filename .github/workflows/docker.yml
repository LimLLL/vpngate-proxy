name: Publish image
# Publishes only commits whose gateway tests passed: main builds follow a
# successful "Go native gateway" push run; v* tags and manual runs build as is.
# Each architecture builds natively on its own runner (no QEMU for the C++
# Core), pushes by digest, and a final job joins them under the tags.
on:
  workflow_run:
    workflows: ["Go native gateway"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  # Queue publishes in trigger order so "latest" ends on the newest commit.
  group: publish-image
  cancel-in-progress: false
env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b67037742b2
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Name the image
        id: names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          printf 'arch=%s\n' "${PLATFORM#linux/}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: OPENVPN3_COMMIT=${{ env.OPENVPN3_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.licenses=GPL-3.0
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ steps.names.outputs.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ steps.names.outputs.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.names.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-architecture image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "${image}:sha-${SOURCE_SHA::7}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags+=(-t "${image}:${GITHUB_REF_NAME#v}")
          else
            tags+=(-t "${image}:latest")
          fi
          cd "${RUNNER_TEMP}/digests"
          sources=()
          for digest in *; do
            sources+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${image}:sha-${SOURCE_SHA::7}"
