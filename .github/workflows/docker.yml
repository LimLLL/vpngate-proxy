name: Publish image
# Publishes only commits whose gateway tests passed: main builds follow a
# successful "Go native gateway" push run; v* tags and manual runs build as is.
on:
  workflow_run:
    workflows: ["Go native gateway"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b67037742b2
jobs:
  image:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Choose image tags
        id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:sha-${SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags+=",${image}:${GITHUB_REF_NAME#v}"
          else
            tags+=",${image}:latest"
          fi
          printf 'tags=%s\n' "${tags}" >> "${GITHUB_OUTPUT}"
          printf 'sha=%s\n' "${SHA}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: OPENVPN3_COMMIT=${{ env.OPENVPN3_COMMIT }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
