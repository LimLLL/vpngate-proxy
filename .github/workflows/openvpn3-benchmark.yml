name: OpenVPN backend concurrency benchmark

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Tunnel concurrency values to measure
        required: true
        default: all
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '4'

permissions:
  contents: read

env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b67037742b2

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install measured engine and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake curl g++ git iproute2 ninja-build openvpn pkg-config \
            libasio-dev libcap-dev libfmt-dev liblz4-dev libjsoncpp-dev \
            libssl-dev libxxhash-dev

      - name: Check out the pinned official Core
        run: |
          source_dir="${RUNNER_TEMP}/openvpn3-core"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin https://github.com/OpenVPN/openvpn3.git
          git -C "${source_dir}" fetch --depth 1 origin "${OPENVPN3_COMMIT}"
          git -C "${source_dir}" checkout --detach FETCH_HEAD
          git -C "${source_dir}" rev-parse HEAD

      - name: Build the same Core bridge as the verified integration
        run: cmake -S go_backend -B "${RUNNER_TEMP}/go-bridge-build" -GNinja -DCMAKE_BUILD_TYPE=Release -DOPENVPN3_SOURCE_DIR="${RUNNER_TEMP}/openvpn3-core" && cmake --build "${RUNNER_TEMP}/go-bridge-build" --parallel 2

      - name: Build the release Go benchmark
        run: go build -o "${RUNNER_TEMP}/vpngate-go-benchmark" ./cmd/bench
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build

      - name: Measure 1, 2 and 4 concurrent tunnels on the same node
        run: |
          case '${{ inputs.concurrency }}' in
            all) benchmark_args=(--concurrency 1 --concurrency 2 --concurrency 4) ;;
            1|2|4) benchmark_args=(--concurrency '${{ inputs.concurrency }}') ;;
            *) echo "Invalid concurrency" >&2; exit 64 ;;
          esac
          sudo modprobe tun
          test -c /dev/net/tun
          sudo timeout --signal=TERM --kill-after=10s 15m \
            python3 -m openvpn3_backend.benchmark \
            --workdir "${RUNNER_TEMP}/vpngate-benchmark" \
            --go-binary "${RUNNER_TEMP}/vpngate-go-benchmark" \
            "${benchmark_args[@]}"

      - name: Make sudo-generated diagnostics readable and print failures
        if: '!cancelled()'
        run: |
          results="${RUNNER_TEMP}/vpngate-benchmark"
          if test -d "${results}"; then
            sudo chmod -R a+rX "${results}"
            for log_file in "${results}"/go-*/go.log; do
              if test -f "${log_file}"; then
                printf '\n===== %s =====\n' "${log_file}"
                cat "${log_file}"
              fi
            done
          fi

      - name: Upload reports and native failure logs
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: openvpn3-benchmark-${{ inputs.concurrency }}-${{ github.run_number }}
          path: ${{ runner.temp }}/vpngate-benchmark
          if-no-files-found: warn
          retention-days: 7
