name: Update VPNGate mirror

on:
  schedule:
    # Offset from quarter-hour peaks because GitHub may delay busy schedules.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-vpngate-mirror.yml"
      - "go_backend/cmd/mirror/**"
      - "go_backend/nodes/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vpngate-pages-mirror
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Fetch and validate VPNGate snapshot with Go
        working-directory: go_backend
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/mirror --output-dir "${GITHUB_WORKSPACE}/_site"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
