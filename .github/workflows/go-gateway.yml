name: Go native gateway
concurrency:
  group: native-gateway-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: true
on:
  push:
    paths:
      - "go_backend/**"
      - "scripts/test_session_gateway.sh"
      - ".github/workflows/go-gateway.yml"
  workflow_dispatch:
    inputs:
      live:
        description: "Also verify current VPNGate native TUN egress availability"
        required: false
        default: false
        type: boolean
env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b67037742b2
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install the verified native build dependencies
        timeout-minutes: 5
        run: |
          sudo -E sh -c 'retry() { for attempt in 1 2 3 4 5 6; do "$@" && return 0; sleep 15; done; return 1; }; retry apt-get update; retry env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates cmake curl g++ git iproute2 ninja-build openvpn pkg-config libasio-dev libcap-dev libfmt-dev liblz4-dev libjsoncpp-dev libssl-dev libxxhash-dev iputils-ping'
      - name: Check out the pinned official OpenVPN 3 Core
        run: |
          source_dir="${RUNNER_TEMP}/openvpn3-core"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin https://github.com/OpenVPN/openvpn3.git
          git -C "${source_dir}" fetch --depth 1 origin master
          git --version
          git -C "${source_dir}" checkout --detach FETCH_HEAD
          actual_commit="$(git -C "${source_dir}" rev-parse HEAD)"
          printf 'Core HEAD: %s\nRequired Core: %s\n' "${actual_commit}" "${OPENVPN3_COMMIT}"
          if [ "${actual_commit}" != "${OPENVPN3_COMMIT}" ]; then
            printf 'The fetched Core is not the pinned revision\n' >&2
            exit 1
          fi
      - name: Build the C ABI bridge and official Core with the verified settings
        run: cmake -S go_backend -B "${RUNNER_TEMP}/go-bridge-build" -GNinja -DCMAKE_BUILD_TYPE=Release -DOPENVPN3_SOURCE_DIR="${RUNNER_TEMP}/openvpn3-core" && cmake --build "${RUNNER_TEMP}/go-bridge-build" --parallel 2
      - name: Build, vet and test the complete Go gateway
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
          LD_LIBRARY_PATH: ${{ runner.temp }}/go-bridge-build
          GOFLAGS: -buildvcs=false
        run: |
          cd go_backend
          go test -race -count=1 -timeout 120s ./...
          go vet ./...
          go build -o "${RUNNER_TEMP}/vpngate-proxy" ./cmd/vpngate-proxy
          go run ./cmd/mirror --fixture "${GITHUB_WORKSPACE}/mirror/vpngate.csv" --output-dir "${RUNNER_TEMP}/go-mirror"
          grep -q '"row_count":' "${RUNNER_TEMP}/go-mirror/vpngate.meta.json"
          cmp "${GITHUB_WORKSPACE}/mirror/vpngate.csv" "${RUNNER_TEMP}/go-mirror/vpngate.csv"

      - name: Validate sticky, TTL and concurrent native sessions over real TUNs
        id: session_validation
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
          LD_LIBRARY_PATH: ${{ runner.temp }}/go-bridge-build
          VPNGATE_E2E_PROFILE_GLOB: ${{ runner.temp }}/go-session-test/profiles/*.ovpn
          VPNGATE_SESSION_REPORT: ${{ runner.temp }}/go-session-report.json
        run: sudo --preserve-env=PATH,RUNNER_TEMP,CGO_ENABLED,CGO_LDFLAGS,LD_LIBRARY_PATH,VPNGATE_E2E_PROFILE_GLOB,VPNGATE_SESSION_REPORT bash scripts/test_session_gateway.sh

      - name: Publish the controlled session verification report
        if: steps.session_validation.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: controlled-session-${{ github.run_number }}
          retention-days: 14
          path: ${{ runner.temp }}/go-session-report.json

      - name: Prepare a current VPNGate candidate with Go
        if: inputs.live
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
          go build -race -o "${RUNNER_TEMP}/vpngate-prepare" ./cmd/candidate
          "${RUNNER_TEMP}/vpngate-prepare" --output "${RUNNER_TEMP}/candidate.ovpn" \
            --snapshot-output "${RUNNER_TEMP}/vpngate-live.csv" --device tun0 \
            --fallback "${GITHUB_WORKSPACE}/mirror/vpngate.csv"

      - name: Evaluate the public profile and failed-connection cleanup
        if: inputs.live
        working-directory: go_backend
        env:
          VPNGATE_TEST_PROFILE: ${{ runner.temp }}/candidate.ovpn
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
        run: go test -race ./core -run 'Test(RealVPNGateProfileEvalAndRelease|FailedNativeConnectionCanBeClosed)$' -v

      - name: Compile the race-enabled public VPNGate probe
        if: inputs.live
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
        run: go build -race -o "${RUNNER_TEMP}/vpngate-go-probe" ./cmd/probe

      - name: Verify actual public egress and native stop
        if: inputs.live
        id: live_validation
        run: |
          sudo timeout --signal=TERM --kill-after=5s 70s "${RUNNER_TEMP}/vpngate-go-probe" \
            --profile "${RUNNER_TEMP}/candidate.ovpn" --stay 5s --url "https://api.ipify.org" \
            --connected-file "${RUNNER_TEMP}/go-connected.json" >"${RUNNER_TEMP}/go-probe.log" 2>&1
          cat "${RUNNER_TEMP}/go-probe.log"

      - name: Publish actual public VPNGate verification
        if: inputs.live && steps.live_validation.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: public-vpngate-session-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/go-connected.json
            ${{ runner.temp }}/go-probe.log
          if-no-files-found: error
          retention-days: 7
