name: Go native gateway
concurrency:
  group: native-gateway-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: true
on:
  push:
    paths:
      - "go_backend/**"
      - "scripts/test_session_gateway.sh"
      - "scripts/testbed.sh"
      - ".github/workflows/go-gateway.yml"
      - ".github/actions/native-core/**"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      live:
        description: "Also verify current VPNGate native TUN egress availability"
        required: false
        default: false
        type: boolean
env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b67037742b2
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - uses: ./.github/actions/native-core
        with:
          core-commit: ${{ env.OPENVPN3_COMMIT }}
      - name: Build, vet and test the complete Go gateway
        id: gateway_build
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
          LD_LIBRARY_PATH: ${{ runner.temp }}/go-bridge-build
          GOFLAGS: -buildvcs=false
        run: |
          cd go_backend
          go test -race -count=1 -timeout 120s ./...
          go vet ./...
          go build -o "${RUNNER_TEMP}/vpngate-proxy" ./cmd/vpngate-proxy

      - name: Validate sticky, TTL and concurrent native sessions over real TUNs
        id: session_validation
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
          LD_LIBRARY_PATH: ${{ runner.temp }}/go-bridge-build
          VPNGATE_E2E_PROFILE_GLOB: ${{ runner.temp }}/go-session-test/profiles/*.ovpn
          VPNGATE_SESSION_REPORT: ${{ runner.temp }}/go-session-report.json
        run: sudo --preserve-env=PATH,RUNNER_TEMP,CGO_ENABLED,CGO_LDFLAGS,LD_LIBRARY_PATH,VPNGATE_E2E_PROFILE_GLOB,VPNGATE_SESSION_REPORT bash scripts/test_session_gateway.sh

      - name: Publish the controlled session verification report
        if: steps.session_validation.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: controlled-session-${{ github.run_number }}
          retention-days: 14
          path: ${{ runner.temp }}/go-session-report.json

      - name: Prepare a current VPNGate candidate with Go
        if: inputs.live
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
          go build -race -o "${RUNNER_TEMP}/vpngate-prepare" ./cmd/candidate
          "${RUNNER_TEMP}/vpngate-prepare" --output-dir "${RUNNER_TEMP}/candidates" --count 5 \
            --snapshot-output "${RUNNER_TEMP}/vpngate-live.csv" --device tun0 \
            --fallback "${GITHUB_WORKSPACE}/go_backend/nodes/testdata/vpngate.csv"

      - name: Evaluate the public profile and failed-connection cleanup
        if: inputs.live
        working-directory: go_backend
        env:
          VPNGATE_TEST_PROFILE: ${{ runner.temp }}/candidates/01.ovpn
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
        run: go test -race ./core -run 'Test(RealVPNGateProfileEvalAndRelease|FailedNativeConnectionCanBeClosed)$' -v

      - name: Compile the public VPNGate probe
        if: inputs.live
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
        # Without -race: a race build exits through C exit() and Core's C++
        # static destructors, which can hang (see core/main_test.go).
        run: go build -o "${RUNNER_TEMP}/vpngate-go-probe" ./cmd/probe

      - name: Verify actual public egress and native stop
        if: inputs.live
        id: live_validation
        # The probe tries the candidates in order until one carries traffic.
        run: |
          rc=0
          sudo timeout --signal=TERM --kill-after=5s 300s "${RUNNER_TEMP}/vpngate-go-probe" \
            --profile "${RUNNER_TEMP}/candidates/*.ovpn" --stay 5s --url "https://api.ipify.org" \
            --connected-file "${RUNNER_TEMP}/go-connected.json" >"${RUNNER_TEMP}/go-probe.log" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/go-probe.log"
          [[ ${rc} -eq 0 ]] || exit "${rc}"
          # The probe runs as root and writes 0600; the artifact upload runs as the runner user.
          sudo chmod a+r "${RUNNER_TEMP}/go-connected.json"

      # Independent of the single-tunnel probe above, so one cannot hide the other.
      - name: Verify the proxy against public VPNGate nodes
        if: inputs.live && !cancelled() && steps.gateway_build.outcome == 'success'
        run: sudo --preserve-env=RUNNER_TEMP,GITHUB_STEP_SUMMARY bash scripts/live_proxy_check.sh "${RUNNER_TEMP}/vpngate-proxy"

      - name: Publish actual public VPNGate verification
        if: inputs.live && steps.live_validation.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: public-vpngate-session-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/go-connected.json
            ${{ runner.temp }}/go-probe.log
          if-no-files-found: error
          retention-days: 7
