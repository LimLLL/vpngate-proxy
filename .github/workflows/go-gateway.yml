name: Go native gateway
concurrency:
  group: native-gateway-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: true
on:
  push:
    paths:
      - "go_backend/**"
      - "scripts/test_session_gateway.sh"
      - ".github/workflows/go-gateway.yml"
  workflow_dispatch: {}
env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b670377b2
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install the verified native build dependencies
        timeout-minutes: 5
        run: |
          sudo -E sh -c 'retry() { for attempt in 1 2 3 4 5 6; do "$@" && return 0; sleep 15; done; return 1; }; retry apt-get update; retry env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates cmake curl g++ git iproute2 ninja-build openvpn pkg-config libasio-dev libcap-dev libfmt-dev liblz4-dev libjsoncpp-dev libssl-dev libxxhash-dev iputils-ping'
      - name: Check out the pinned official OpenVPN 3 Core
        run: |
          source_dir="${RUNNER_TEMP}/openvpn3-core"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin https://github.com/OpenVPN/openvpn3.git
          git -C "${source_dir}" fetch --depth 1 origin master
          git -C "${source_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${source_dir}" rev-parse HEAD)" = "${OPENVPN3_COMMIT}"
      - name: Build the C ABI bridge and official Core with the verified settings
        run: cmake -S go_backend -B "${RUNNER_TEMP}/go-bridge-build" -GNinja -DCMAKE_BUILD_TYPE=Release -DOPENVPN3_SOURCE_DIR="${RUNNER_TEMP}/openvpn3-core" && cmake --build "${RUNNER_TEMP}/go-bridge-build" --parallel 2
      - name: Build, vet and test the complete Go gateway
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
          LD_LIBRARY_PATH: ${{ runner.temp }}/go-bridge-build
          GOFLAGS: -buildvcs=false
        run: |
          cd go_backend
          go test -race -count=1 -timeout 120s ./...
          go vet ./...
          go build -o "${RUNNER_TEMP}/vpngate-proxy" ./cmd/vpngate-proxy
          go run ./cmd/mirror --fixture "${GITHUB_WORKSPACE}/mirror/vpngate.csv" --output-dir "${RUNNER_TEMP}/go-mirror"
          grep -q '"row_count":' "${RUNNER_TEMP}/go-mirror/vpngate.meta.json"
          cmp "${GITHUB_WORKSPACE}/mirror/vpngate.csv" "${RUNNER_TEMP}/go-mirror/vpngate.csv"

      - name: Validate sticky, TTL and concurrent native sessions over real TUNs
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build
          LD_LIBRARY_PATH: ${{ runner.temp }}/go-bridge-build
          VPNGATE_E2E_PROFILE_GLOB: ${{ runner.temp }}/go-session-test/profiles/*.ovpn
          VPNGATE_SESSION_REPORT: ${{ runner.temp }}/go-session-report.json
        run: sudo --preserve-env=PATH,CGO_ENABLED,CGO_LDFLAGS,LD_LIBRARY_PATH,VPNGATE_E2E_PROFILE_GLOB,VPNGATE_SESSION_REPORT bash scripts/test_session_gateway.sh

      - name: Publish the controlled session verification report
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: controlled-session-${{ github.run_number }}
          retention-days: 14
          path: ${{ runner.temp }}/go-session-report.json
