name: Go and OpenVPN 3 Core

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openvpn3-go.yml"
      - "go_backend/**"
      - "openvpn3_backend/export_live_profile.py"
      - "openvpn3_backend/proxy_smoke.py"
      - "openvpn3_backend/benchmark.py"
      - "openvpn3_backend/local_testbed.py"
      - "openvpn3_backend/local_auth.py"
      - "openvpn3_backend/cli_backend.py"
      - "openvpn3_backend/live_vpngate.py"
      - "openvpn3_backend/profiles.py"
  workflow_dispatch:
    inputs:
      live_test:
        description: Connect a real VPNGate node and check the existing SOCKS5 proxy
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  OPENVPN3_COMMIT: 0b27d9df493db8bc9dc459a2b1cb6b67037742b2

jobs:
  go-core:
    name: Go controller with native C++ Core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake curl g++ git iproute2 ninja-build openvpn pkg-config \
            libasio-dev libcap-dev libfmt-dev liblz4-dev libjsoncpp-dev \
            libssl-dev libxxhash-dev

      - name: Check out the pinned official Core
        run: |
          source_dir="${RUNNER_TEMP}/openvpn3-core"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin https://github.com/OpenVPN/openvpn3.git
          git -C "${source_dir}" fetch --depth 1 origin "${OPENVPN3_COMMIT}"
          git -C "${source_dir}" checkout --detach FETCH_HEAD
          git -C "${source_dir}" rev-parse HEAD

      - name: Build the C ABI bridge and official Core
        run: cmake -S go_backend -B "${RUNNER_TEMP}/go-bridge-build" -GNinja -DCMAKE_BUILD_TYPE=Release -DOPENVPN3_SOURCE_DIR="${RUNNER_TEMP}/openvpn3-core" && cmake --build "${RUNNER_TEMP}/go-bridge-build" --parallel 2

      - name: Test the Go controller
        run: go test -race ./...
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build

      - name: Prepare TUN and fetch a candidate for the live test
        if: github.event_name == 'workflow_dispatch' && inputs.live_test
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
          python3 -m openvpn3_backend.export_live_profile \
            --output "${RUNNER_TEMP}/candidate.ovpn" \
            --snapshot "${RUNNER_TEMP}/vpngate-live.csv" --device tun0

      - name: Evaluate a real profile and verify failed-connection cleanup
        if: github.event_name == 'workflow_dispatch' && inputs.live_test
        run: go test -race ./core -run 'Test(RealVPNGateProfileEvalAndRelease|FailedNativeConnectionCanBeClosed)$' -v
        working-directory: go_backend
        env:
          VPNGATE_TEST_PROFILE: ${{ runner.temp }}/candidate.ovpn
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build

      - name: Compile the race-enabled Go connection probe
        if: github.event_name == 'workflow_dispatch' && inputs.live_test
        run: go build -race -o "${RUNNER_TEMP}/vpngate-go-probe" ./cmd/probe
        working-directory: go_backend
        env:
          CGO_LDFLAGS: -L${{ runner.temp }}/go-bridge-build -Wl,-rpath,${{ runner.temp }}/go-bridge-build

      - name: Connect, verify proxy traffic and stop with Go plus C++ Core
        if: github.event_name == 'workflow_dispatch' && inputs.live_test
        run: |
          sudo timeout --signal=TERM --kill-after=5s 70s "${RUNNER_TEMP}/vpngate-go-probe" \
            --profile "${RUNNER_TEMP}/candidate.ovpn" --stay 30s \
            --connected-file "${RUNNER_TEMP}/go-connected.json" \
            >"${RUNNER_TEMP}/go-probe.log" 2>&1 &
          pid=$!
          for attempt in $(seq 1 45); do
            if test -s "${RUNNER_TEMP}/go-connected.json"; then
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              wait "${pid}" || true
              cat "${RUNNER_TEMP}/go-probe.log"
              exit 1
            fi
            sleep 1
          done
          if ! test -s "${RUNNER_TEMP}/go-connected.json"; then
            cat "${RUNNER_TEMP}/go-probe.log"
            exit 1
          fi
          sudo python3 -m openvpn3_backend.proxy_smoke
          wait "${pid}"
          cat "${RUNNER_TEMP}/go-probe.log"

      - name: Compare the same candidate through the OpenVPN 2.x CLI
        if: github.event_name == 'workflow_dispatch' && inputs.live_test
        run: sudo --preserve-env=PYTHONPATH timeout --signal=TERM --kill-after=5s 90s python3 -m openvpn3_backend.live_vpngate --backend cli --attempts 1 --timeout 10 --stack-dump-after 25 --snapshot "${RUNNER_TEMP}/vpngate-live.csv"
